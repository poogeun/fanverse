spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fanverse
    username: user
    password: user1234
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  upload-dir: ./uploads

mybatis:
  mapper-locations: classpath*:mappers/**/*.xml
  type-aliases-package: com.example.fanverse.entity
  configuration:
    map-underscore-to-camel-case: true